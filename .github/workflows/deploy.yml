name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:
    inputs:
      backend_url:
        description: 'Production backend URL (e.g. https://medtec-backend.onrender.com)'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend for production
        working-directory: ./frontend
        run: npm run build
        env:
          GITHUB_ACTIONS: true
          # VITE_API_URL is set via GitHub Actions secret/variable or defaults to live Render backend
          VITE_API_URL: ${{ secrets.VITE_API_URL || vars.VITE_API_URL || 'https://medtec-dz-1.onrender.com' }}

      - name: Verify build output and create 404.html fallback
        run: |
          if [ ! -f "./frontend/dist/index.html" ]; then
            echo "::error::Build output ./frontend/dist/index.html not found!"
            exit 1
          fi
          # Duplicate index.html to 404.html for GitHub Pages SPA routing fallback
          cp ./frontend/dist/index.html ./frontend/dist/404.html
          echo "Build verified: index.html and 404.html are ready."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist'

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
