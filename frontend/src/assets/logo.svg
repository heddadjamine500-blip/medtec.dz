<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <linearGradient id="medtec-m-exact-grad" x1="40" y1="40" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#20B8A5" />
      <stop offset="50%" stop-color="#2585D8" />
      <stop offset="100%" stop-color="#123B65" />
    </linearGradient>
    <linearGradient id="medtec-cross-exact-grad" x1="80" y1="80" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2585D8" />
      <stop offset="100%" stop-color="#20B8A5" />
    </linearGradient>
    <filter id="med-exact-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Badge container -->
  <rect x="14" y="14" width="212" height="212" rx="46" fill="#123B65" />

  <!-- Geometric M -->
  <path
    d="M 52 176 V 68 L 120 128 L 188 68 V 176"
    stroke="url(#medtec-m-exact-grad)"
    stroke-width="16"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Medical Cross -->
  <path
    d="M 120 94 V 162"
    stroke="url(#medtec-cross-exact-grad)"
    stroke-width="14"
    stroke-linecap="round"
    filter="url(#med-exact-glow)"
  />
  <path
    d="M 86 128 H 154"
    stroke="url(#medtec-cross-exact-grad)"
    stroke-width="14"
    stroke-linecap="round"
    filter="url(#med-exact-glow)"
  />
</svg>