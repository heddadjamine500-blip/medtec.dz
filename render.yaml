# Render deployment configuration for MEDTEC Backend
# https://render.com/docs/yaml-spec

services:
  - type: web
    name: medtec-backend
    runtime: node
    plan: free
    rootDir: backend

    # Build steps: install → generate Prisma client → compile TypeScript
    buildCommand: npm install && npx prisma generate && npm run build

    # Production start command – runs the compiled JS
    startCommand: npm run start

    # Render will set PORT automatically; server listens on 0.0.0.0
    healthCheckPath: /api/health

    # Persistent disk for SQLite database (10 GB free on Render)
    disk:
      name: medtec-sqlite-disk
      mountPath: /data
      sizeGB: 1

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        generateValue: false
        value: "10000"
      # DATABASE_PATH points to the persistent disk mount
      - key: DATABASE_PATH
        value: /data/dev.db
      # Set these secrets in the Render dashboard (do NOT commit real values):
      - key: JWT_SECRET
        sync: false   # marks as a secret – set manually in Render dashboard
      - key: CLIENT_URL
        value: https://heddadjamine500-blip.github.io
      - key: CORS_ORIGIN
        value: https://heddadjamine500-blip.github.io
