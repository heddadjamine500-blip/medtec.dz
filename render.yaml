# Render deployment configuration for MEDTEC Backend (100% Free Tier compatible)
# https://render.com/docs/yaml-spec

services:
  - type: web
    name: medtec-backend
    runtime: node
    plan: free
    rootDir: backend

    # Build steps: install dependencies -> generate Prisma client -> compile TypeScript
    buildCommand: npm install && npx prisma generate && npm run build

    # Production start command
    startCommand: npm run start

    # Health check endpoint
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://heddadjamine500-blip.github.io
      - key: CORS_ORIGIN
        value: https://heddadjamine500-blip.github.io
